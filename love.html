<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>表白</title>
  <style>
    body { margin: 0; background: white; font-family: "Comic Sans MS"; overflow: hidden; }
    .center {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .heart {
      color: pink;
      font-size: 300px;
    }
    .popup {
      position: absolute;
      color: white;
      background: pink;
      padding: 10px;
      border-radius: 8px;
      animation: float 5s linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-200px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="center" id="main">
    <p style="font-size: 20px;">亲爱的，做我女朋友好吗？</p>
    <button onclick="accept()">好哦</button>
    <button onclick="alert('再给你一次机会！')">不要</button>
  </div>

  <div class="center" id="heart" style="display:none;">
    <div class="heart">❤</div>
  </div>

  <script>
    function accept() {
      document.getElementById("main").style.display = "none";
      document.getElementById("heart").style.display = "block";
      for (let i = 0; i < 50; i++) {
        setTimeout(() => spawnLove(), i * 100);
      }
    }

    function spawnLove() {
      let div = document.createElement("div");
      div.className = "popup";
      div.innerText = "I LOVE YOU!";
      div.style.left = Math.random() * window.innerWidth + "px";
      div.style.top = Math.random() * window.innerHeight + "px";
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 5000);
    }
  </script>
</body>
</html>
</title>

</html>
